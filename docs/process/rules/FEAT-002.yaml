           **尺寸按 JPEG 结构判**：解析 SOF 段（`FFC0`~`FFCF` 去掉 `C4`/`C8`/`CC`，基线 `C0` 与渐进 `C2` 都覆盖）取宽高 ⇒ 断言「宽 == 高（ui-spec `UI-12` 的 `aspect-ratio: 1/1`）且边长 ≥ 400（ui-spec §九 照片规格 400×400 作**下限**，dev 实际可用 800×800）」。
           主控裁定：**删掉原「≥ 2 KiB」暂定阈值**（无依据的字面阈值 = 护栏变噪音），不再引入任何无依据数值；
        ② 8 个文件名与种子商品 id 双向一一对应（照片无 `<title>`，不再按标题文本回填）；
        ③ 首帧 `li.card[data-product-id]` **逐卡**断「卡内主图 `src` == `/assets/products/<本卡商品 id>.jpg`」（照片是二进制、读不出商品名 ⇒ 对应关系只能按卡断；**题材是否对货属语义判断，机器不断**，归人工看图留痕）；
           并断 8 个 `src` 剥掉查询串后逐条命中 `^/assets/products/P-00[1-8]\.jpg$`、不得是 `http(s)://` / `//` 外链（自托管的收益就是零外链，此语义**不放宽**）、
           **查询串只许内容指纹 `?v=<hash>`（≥6 位 `[A-Za-z0-9_-]`）** —— 采纳 pm 口径：正则一字不改、先剥查询串再匹配路径，但必须同时钉住查询串形态，否则「剥查询串」会变成万能放行口（`?x=1` / 指纹退化成 `?v=0` 都红）；
        ④ 运行期引用（JS 模块模板串 / CSS）在 `/assets/products/` 这一点下不得残留 `.svg|.png|.webp|.gif|.jpeg`（首帧判据看不见 JS 渲染路径，故单列）；模板 `${…}` 插值与字符串拼接两种写法都接受；
        ⑤ `web/assets/products/CREDITS.md` 必须存在；8 个本地文件名**各自那一行**必须同时给出**6 项**：① 本地文件名 ② **商品名** ③ **作者** ④ **来源页 URL**（逐行各自登记，**不得只在文件某处给一条、也不得用许可 URL 顶替**）⑤ **许可名**（`CC BY|CC0|public domain|公有领域|Unsplash|Pexels|Pixabay|License|许可|授权|版权`）⑥ **许可 URL**（`creativecommons.org/licenses/…` 等许可类 URL）；且不得登记盘上不存在的文件；行内 URL 不得写成 HTML 实体（`R-4` 的 `&amp;` 半，见下）。
           主控 2026-10-16 **两轮**裁定收紧要旨：CREDITS 是**合规署名件**（`by` / `by-sa` 要求署名），只给全文一条 URL 时「哪个来源页属于哪张图」无法复核 ⇒ 必须**逐行**；第二轮（`02:25Z`）再收到与真源（PRD `AC-48` ⑤ / `UI-67`）**严格同口径**：补齐「商品名」「许可 URL」两项 + `R-4` 的 `&amp;` 半。
           **商品名**判定 = 「带 `商品名：` 标注」**或**「该行含 ≥2 个非 URL / 非许可 / 非文件名的文本字段（= 商品名 + 作者）」；**作者**判定 = 「带 `作者 / 摄影 / 拍摄 / Photo by / credit / ©` 等标注」**或**同上 ≥2 字段。
           为什么不按种子商品名硬匹配：照片 / 文案改名不该判红（主控口径）⇒ 只按**结构**判「该行有没有第二个文本字段」。副作用已披露：删掉商品名列时该行只剩 1 个文本字段 ⇒ **商品名条与作者条都红**（无法从单字段反推它到底是哪一个）——判红正确，只是归因合并。
           解析口径**格式无关**：表格行（`|`）/ 破折号 `—`·间隔号 `·`·全角竖线 `｜`·斜杠分隔 / 项目符号行都能读；带「商品名：/ 作者：/ 来源页：」标注的行按标注取值；markdown 链接 `[作者](url)` 与尖括号 `<url>` 按链接文本剥壳后再分类（作者写成链接 ⇒ 仍判作者 ✓）。已对 dev 真件（6 列表格）+ 全角标注 6 项 + 破折号单行 6 字段 + 作者成链接逐一实测（全绿）。
           **本轮自查抓到自己实现的两个洞（都已修；属判据实现缺陷、非口径变化）**：(a) 作者标注正则原本含裸 `by`，会被许可名 `CC BY 2.0` 里的「BY」命中 ⇒ **无作者的行也判绿**（已去掉裸 `by`，只留 `Photo by`）；
           (b) 逐行 URL 原本只看「行内有没有 `https://`」⇒ **许可 URL 能顶掉来源页**（删掉来源页列、只留 `creativecommons.org/licenses/…` 仍判绿）；已改为「来源页 URL = 非许可类 URL」（按 `creativecommons|licen[cs]e|publicdomain|/cc0|by-sa|by-nc|by-nd` 识别许可类），并保留「`来源页：<URL>` 显式标注」写法。
           反例实测（校验和比对通过的副本，逐条隔离，各只红本条的对应断言）：**删商品名列 ⇒ 商品名条红**；**删许可 URL 列 ⇒ 许可 URL 条红**；**许可 URL 写成 `&amp;` ⇒ `R-4` 条红**；删来源页列（只留许可 URL）⇒ 来源页条红；删作者列 ⇒ 红。应绿：dev 真件 / 全角标注 / 破折号 / 作者成 markdown 链接 ⇒ ui 13/13 rc=0。
           ⚠ `CREDITS.md` 里的来源站 URL **不属于** `AC-52` 的禁用清单（那断淘宝系域名与运行期引用），两处判据不打架；PRD `AC-48` ⑤ 已显式写明这一点。
      ⚠ 原「SVG 文本可 diff / ≤2KB / 无内嵌位图」三条随语义消失（照片是二进制，文本可 diff 不可得）——这是本次**有意**放弃的性质，已报主控。
      ⚠ 新发现的实现坑（非本判据放宽，见报告）：
        (a) 静态面 `server/src/static.mjs` 用 `readFileSync(path,'utf8')` 读盘、`negotiate()` 吐字符串，`server/src/app.mjs:641` 又 `Buffer.from(body,'utf8')` 重编码
            ⇒ **二进制图片会被写坏**（实测 2054 字节文件上线 2066 字节、SOI 变 U+FFFD）；白名单加 `.jpg` 不足以交付真照片，静态读盘必须 Buffer 化。本条 ① 与 TC-002-49 的线上字节判据就是钉这个的。
        (b) **指纹会静默失效**：`versionOf(join('assets','products',`${product.id}.svg`))` 是**拼出来的**路径（不是字面 `/assets/products/`），换扩展名时最容易漏改
            ⇒ 主图 URL 退化成 `?v=0`（常量指纹 = 长缓存永不失效；`AC-31` 只验缓存头、验不出它）⇒ 本条 ③ 的「查询串只许 `?v=<hash>`」正是拦这个的（副本实测：漏改时 `?v=0` 判红）。
      红波次实读（仓库现状，2026-10-16T01:45Z 复跑，含本轮新增的 SOF / 查询串 / 逐卡配对 / 来源 URL 判据）：`node --test test/packages/FEAT-002/ui.test.mjs` tests 13 / pass 12 / fail 1 / exit 1，唯一红＝本条，首命中「必须恰是这 8 张自托管主图…实际 []」（磁盘 0 张 .jpg，仍是 8 张 .svg）。
      判据自证（副本复刻，不碰 `web/**`；用 Pillow 生成的真 JPEG，非合成字节）：造出「.jpg + 二进制读盘 + `versionOf` 同步 + `CREDITS.md`」的正确实现后本条 13/13 全绿（800×800 基线 JPEG）；
        SOF 解析器先做单元自证：800×800（`C0`）/ 400×400 / 800×800 渐进（`C2`）全绿，800×600 与 100×100 按正方形 / 下限判红，改名 SVG 文本 / 零字节 / 仅 SOI 解析失败；
        反例逐一**隔离**命中对应断言：删 `CREDITS.md` ⇒ ⑤ 存在性红；`P-003.jpg` 换成改名 SVG 文本 ⇒ ① magic 红（实际 `3c 73 76 67`）；残留 `P-003.svg` ⇒ ① 残留红；
        `P-004.jpg` 换 800×600 ⇒ ① 正方红；换 100×100 ⇒ ① 下限红；首卡 `data-product-id` 与卡内主图不符（图集仍齐全）⇒ ③ 逐卡配对红；
        首帧指纹串改 `?x=<hash>` ⇒ ③ 查询串红；`CREDITS.md` 去掉来源 URL（许可仍在）⇒ ⑤ `UI-67` 红；某 JS 模块引用退回 `.svg`（首帧仍正确）⇒ ④ 运行期引用红；
        漏改 `versionOf`（指纹 `?v=0`）⇒ ③ 查询串红。**以上每次只破坏一处、其余保持绿**。
       ✅ 转绿实读（**整包 verify · 独立复跑**，2026-10-16T02:15Z）：`node --test test/packages/FEAT-002/*.test.mjs` **tests 82 / pass 82 / fail 0 / exit 0**（35.1s，**含 `deploy.test.mjs` 7 条**）；
         `npm test` **134 / pass 134 / exit 0**；`ui.test.mjs` 13/13 与 `static.test.mjs` 9/9 单独复跑亦 rc=0；三条门禁 rc=0（`check-rules` 176 ✓ / 0 ❌、`sync-prd-version FEAT-002 --check` rc=0、`check-artifact-paths` rc=0）。台账 `actual` 已翻 green（`expect` 留 red 作红波次历史）。跑完容器 / 卷无残留、3000/80/443 已释放。
         反例隔离（校验和比对通过的副本，逐条只破坏该处）：① 静态读盘退回 utf8（**白名单与 content-type 仍对**）⇒ `AC-49` 红，首命中「content-length 应等于盘上 28258 字节，实际 50674」；
         ② **等长**改写盘上字节（长度判据仍绿）⇒ `AC-49` 红，首命中「线上响应体头 3 字节必须是 JPEG SOI，实际 `3f d8 ff`」⇒ ③④ 不可互替再次实证；
         ③ `versionOf` 路径退回 `.svg`（指纹 `?v=0`）⇒ `AC-48` 红，首命中「查询串只允许内容指纹 `?v=<hash>`（≥6 位 hash 形态），实际 `?v=0`」。每次仅目标判据红，其余全绿。
         真照片 SOF 实测（`P-001`~`P-008`）：400 / 450 / 400 / 400 / 518 / 448 / 800 / 500 ⇒ 全部正方形且 ≥400（`P-001` 由源图 394×394 最小放大到 400×400，主控已接受）。
         ✅ 真源对等性**已闭合**（主控 2026-10-16T02:25Z 授权，本轮已落）：⑤ 的逐行要求由 4 项收到真源的 **6 项**（补「商品名」「许可 URL」）；`R-4` 的 `&amp;` 半已机器化，「URL 被截断」半按主控裁定**不造假护栏**、维持文档要求。
            收紧后复跑（随机端口，未碰 `:3000` / 容器）：`ui.test.mjs` 13/13 rc=0、`static.test.mjs` 9/9 rc=0（dev 真件直接通过 6 项口径）；`check-rules` rc=0。
