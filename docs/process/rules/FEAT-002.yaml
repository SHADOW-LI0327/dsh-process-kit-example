  - id: TC-FEAT-002-32
    title: 备份保留十四天｜每日备份库文件、保留 14 天、恢复步骤可执行
    ac: AC-32
    ac_name: 备份保留十四天｜每日备份库文件、保留 14 天、恢复步骤可执行
    automation: node
    expect: red
    actual: green
    blocker: none
    note: 保留基准同时给文件名日期与 mtime（两种实现声明口径均覆盖）；容器卷**回滚效果**已从 UAT 收回本用例（UAT `E7`/`E8`/`E9`，2026-10-15）：
      ① 静默空操作（`E7`）：从 `docs/DEPLOY.md`「回滚」节**逐字抽取** bash 块执行（只抽取、不改写文档）；哨兵进快照后，应用侧读到的库**指纹必须变**且内容必须是哨兵。
      ② 崩溃路径（`E9`，**最强**）：先 `docker kill`（SIGKILL）制造残留 `-wal` —— **必须 kill、不能用 `down`**：干净停机会 checkpoint，`-wal` 根本不存在，只走干净路径的断言**永远抓不到**这一条（触发条件＝OOM / `docker kill` / 宿主重启等非干净停机）。
         并**硬断言前置**「卷内确实存在 `shop.db-wal`」（不存在即显式判红并说明本用例无对象，绝不放行）；随后执行文档第 2 步，回滚后读到的必须是**快照时刻的 A**（读到 B ⇒ WAL 被回放、回滚被自己撤销，而命令 rc=0、主文件指纹与快照逐位相同、`/health` 200 —— 全绿却失败）；
         且卷内不得残留 `-wal`/`-shm`（残留清单以**读库之前**的 `ls` 为准 —— 读库本身会 checkpoint，放在读之后会被自己的取证动作救成假绿）。
      ③ 同日覆盖（`E8`）：同日两次备份 ⇒ 快照目录仍只有 1 个文件且指纹已变；文档「回滚」节内必须写明「UTC 日 / 同日覆盖 / 手工另存」（**限定在该节内**取窗口，避免「数据在哪」节里的同类表述把它救成假绿）。
      全程在独立项目名 `COMPOSE_PROJECT_NAME=feat002t` 下跑（实测卷名 `feat002t_shop-data`）；起常驻 app 用 `compose run -d`（不带 `--service-ports`）⇒ 不发布宿主端口，绝不与 UAT 的 `shop` 栈抢卷或抢 3000/80/443。
      前置＝docker daemon + `shop:local` 镜像（缺失时按文档升级第 1 步构建；构建失败按**基建假红**分列，不混入真缺口红）。反例实测（均逐位还原，`docs/DEPLOY.md` sha256 前后同值 `987a6494…`）：删清理行 ⇒ 红在 **C1 效果断言**（读到 B，**不是**前置/残留断言）；清理行只删 `-shm` ⇒ 红在 **C2 残留断言**（`["backups","shop.db","shop.db-shm"]`）；删「回滚」节同日覆盖段 ⇒ 红；`E7` 三则（旧手写卷名 / 「单服务」/「2 个服务」）⇒ 红（原件 `b2574358…`）。
      ⚠ 陷阱登记（2026-10-15 Gate4，与 dev 双向对齐）：**别把多操作数 `ls` 放在 `&&` 链尾** —— `ls -l a b c` 只要有一个操作数不存在就**退出 1**，`2>/dev/null` 只吞报错文字、**不改退出码**；快照覆盖后 `-wal`/`-shm` 本就不存在 ⇒ 链主体（`rm` + `cp`）其实做成了、退出码却非 0（**假失败**，与 `P-19`/`E7`/`E9` 的静默假成功相反，同属「退出码与语义不一致」面）。本用例历史红报文「文档「回滚」命令必须退出 0，实际 1」的真凶即此，**不是 `chown`**（实测：容器内以 node 身份 `chown node:node` 自己拥有的文件 rc=0）；复现读数：单操作数链 rc=0 / 多操作数链 rc=1 且 stdout 仍打印 `-rw-r--r-- … /data/shop.db`。现版链尾已收成单文件 ⇒ rc=0；此处**不加新判据**（条数仍 82），只留登记。
      终态确认性复跑（2026-10-15T08:44Z，Gate4 用）：`docs/DEPLOY.md` 终态 `e2c94818…`（185 行）vs 上轮所验 `987a6494…`（177 行），差异**仅在「回滚」节第 4 步的 cookie 罐说明**；**第 1 个 bash 块（本用例抽取目标）逐字未动**（块 sha256 前后同值 `a05db531…`）⇒ 抽取口径与全部判据在终态下继续成立。
