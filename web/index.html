<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手冲小铺 · 器材与咖啡豆</title>
    <meta
      name="description"
      content="手冲咖啡器材与咖啡豆的小铺：浏览商品、加入购物车、假支付下单与查看订单的演示站点。"
    />
    <link rel="stylesheet" href="/src/styles.css?v={{V_STYLES}}" />
    <script type="application/json" id="asset-versions">{{ASSET_VERSIONS}}</script>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script type="module" src="/src/main.mjs?v={{V_MAIN}}"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/products">
          <span class="brand__mark" aria-hidden="true">冲</span>
          <span class="brand__name">手冲小铺</span>
        </a>
        <div class="search">
          <input
            class="search__input"
            id="search-input"
            type="search"
            placeholder="搜索商品"
            autocomplete="off"
            aria-label="搜索商品"
          />
        </div>
      </div>
    </header>

    <main class="page" id="view">
      <section class="hero" aria-labelledby="hero-title">
        <p class="promo">满 99 元包邮</p>
        <h1 class="hero__title" id="hero-title">手冲器材 · 今日现货</h1>
        <p class="hero__count" id="product-count">共 {{PRODUCT_COUNT}} 件商品</p>
        <p class="hero__note">
          演示站点：下单即视为已支付（假支付），不产生任何真实扣款，也不发真实快递。
        </p>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <h2 class="catalog__title" id="catalog-title">商品列表</h2>
        <p class="catalog__empty" id="search-empty" hidden>没有找到相关商品<span class="empty__hint">换个词再试，或清空顶部搜索框。</span></p>
        <ul class="grid" id="product-grid">{{PRODUCT_CARDS}}</ul>
      </section>

      <noscript>{{NOSCRIPT_CATALOG}}</noscript>
    </main>

    <nav class="tabbar" aria-label="底部导航">
      <a class="tabbar__item is-active" data-tab="products" href="#/products">首页</a>
      <a class="tabbar__item" data-tab="cart" href="#/cart"
        >购物车<span class="tabbar__count" id="tab-cart-count" hidden>0</span></a
      >
      <a class="tabbar__item" data-tab="orders" href="#/orders">订单</a>
      <a class="tabbar__item" data-tab="me" href="#/me">我的</a>
    </nav>
  </body>
</html>
