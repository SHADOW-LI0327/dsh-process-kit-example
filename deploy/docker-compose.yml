# 单机一键起：库与备份都走具名卷，容器根文件系统只读，临时目录走 tmpfs。
# 用法：docker compose -f deploy/docker-compose.yml up -d
# HTTPS：加 --profile proxy（见 deploy/Caddyfile 与 docs/DEPLOY.md「需要 HTTPS 时」）。
# 变量可放进 deploy/.env（见 deploy/.env.example）。
# 应用端口只发布到宿主回环：对外一律经反代，别让应用裸听在对外网卡上。
# 反代档启动时会自检 COOKIE_SECURE / TRUST_PROXY 是否都为 1，不为 1 直接拒起（宁可不给流量）。
name: shop

services:
  # 起服前先给现有库打一份快照（升级/回滚都靠它兜底）；首次运行无库时跳过且退出 0。
  backup:
    image: shop:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "scripts/ops/backup.mjs"]
    environment:
      DB_PATH: /data/shop.db
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - shop-data:/data
    restart: "no"

  app:
    image: shop:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      backup:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/shop.db
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: "14"
      LOG_LEVEL: info
      NODE_ENV: production
      # 必填且**不给默认值**：默认一个「能用的」密钥等于把所有人的会话交给公开值。
      # 未提供时这里是空串 —— 生产档会以配置错误拒启（不静默退回弱密钥）。
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      # 只绑宿主回环：需要对外时走反代档案（`--profile proxy`），不直接把应用暴露到公网。
      - "127.0.0.1:3000:3000"
    volumes:
      - shop-data:/data
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 反代（TLS 在反代终结）：只在 `--profile proxy` 时起。
  # 应用自身仍只跑 HTTP；起反代时必须把 COOKIE_SECURE 与 TRUST_PROXY 同时置 1
  # （deploy/.env 里改），否则会给出不带 Secure 的会话 cookie，或采信不到转发头。
  proxy:
    image: caddy:alpine
    profiles: ["proxy"]
    # 反代在 TLS 上终结 ⇒ 应用侧必须发 Secure cookie、并采信转发头。
    # 这里只做「不满足就拒起」的自检（不替使用者改应用侧的值），免得哪天悄悄跑成明文 cookie。
    command:
      - sh
      - -c
      - >-
        [ "$$COOKIE_SECURE" = "1" ] && [ "$$TRUST_PROXY" = "1" ] ||
        { echo "反代档必须同时置 COOKIE_SECURE=1 与 TRUST_PROXY=1（写在 deploy/.env 里）" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 本站配置；数据卷存证书与 ACME 状态，配置卷存 Caddy 自动生成的配置
      # ⇒ 容器重建不重签证书（证书重签会撞 ACME 速率限制）。
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      # 探针走 Caddy 自己的站点地址（Caddyfile 的站点名）：换站点名时这里要跟着换，
      # 否则 SNI 对不上站点，握手会以 alert 80（unrecognized name）被拒。
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "/dev/null",
          "https://localhost/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  shop-data:
  caddy-data:
  caddy-config:
