# 单机一键起：库与备份都走具名卷，容器根文件系统只读，临时目录走 tmpfs。
# 用法：docker compose -f deploy/docker-compose.yml up -d
# HTTPS：加 --profile proxy（见 deploy/Caddyfile 与 docs/DEPLOY.md「需要 HTTPS 时」）。
# 变量可放进 deploy/.env（见 deploy/.env.example）。
name: shop

services:
  # 起服前先给现有库打一份快照（升级/回滚都靠它兜底）；首次运行无库时跳过且退出 0。
  backup:
    image: shop:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "scripts/ops/backup.mjs"]
    environment:
      DB_PATH: /data/shop.db
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - shop-data:/data
    restart: "no"

  app:
    image: shop:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      backup:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/shop.db
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: "14"
      LOG_LEVEL: info
      NODE_ENV: production
      # 生产必须替换成真随机值：openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-with-openssl-rand-hex-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "3000:3000"
    volumes:
      - shop-data:/data
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 反代（TLS 在反代终结）：只在 `--profile proxy` 时起。
  # 应用自身仍只跑 HTTP；起反代时必须把 COOKIE_SECURE 与 TRUST_PROXY 同时置 1
  # （deploy/.env 里改），否则会给出不带 Secure 的会话 cookie，或采信不到转发头。
  proxy:
    image: caddy:alpine
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 本站配置；数据卷存证书与 ACME 状态，配置卷存 Caddy 自动生成的配置
      # ⇒ 容器重建不重签证书（证书重签会撞 ACME 速率限制）。
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      # 探针走 Caddy 自己的站点地址（Caddyfile 的站点名）：换站点名时这里要跟着换，
      # 否则 SNI 对不上站点，握手会以 alert 80（unrecognized name）被拒。
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "/dev/null",
          "https://localhost/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  shop-data:
  caddy-data:
  caddy-config:
